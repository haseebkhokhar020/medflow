name: Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  windows:
    needs: verify
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      # Manual release-candidate runs make installers available to the maintainer.
      # A versioned public Release is created separately after CI and owner sign-off.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MedFlow-Setup-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
